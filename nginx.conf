# Brute-force backstop on the actual credential-checking endpoints only —
# NOT the whole /api/auth/ prefix, which also covers csrf/providers/session
# polling that every page load makes and that carries no password to guess.
# 20/min sustained + a burst of 10 comfortably covers a human mistyping a
# password a few times, while still capping a scripted attacker at 1200/hr.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# Forward whatever protocol the request actually arrived as (set by an
# outer TLS-terminating proxy like Caddy) instead of blindly overwriting it
# with nginx's own $scheme, which is "http" here since nginx itself never
# terminates TLS. Getting this wrong makes NextAuth (admin + backend) decide
# the request is insecure, so it looks for the non-Secure-prefixed cookie
# name instead of the one the browser actually sent — auth then silently
# fails on any API call proxied through to the backend. Falls back to
# nginx's own $scheme when there's no outer proxy (e.g. hitting nginx
# directly on its published port without Caddy in front).
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/auth/callback/credentials {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location /api/app/auth/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://admin:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }
}
