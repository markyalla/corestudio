name: CI

on:
  push:
  pull_request:

env:
  # Dummy values so builds/typechecks/prisma generate have something to read.
  # Real secrets live only in the deployment target's .env — never here.
  DATABASE_URL: postgresql://corestudio:corestudio_dev@localhost:5432/corestudio
  AUTH_SECRET: ci-placeholder-secret-not-for-prod
  AUTH_URL: http://localhost:3000
  SMS_PROVIDER: console

jobs:
  backend-and-admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corestudio
          POSTGRES_PASSWORD: corestudio_dev
          POSTGRES_DB: corestudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U corestudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (backend + admin workspaces)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Type-check backend
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Type-check admin
        run: npx tsc --noEmit -p admin/tsconfig.json

      - name: Lint backend
        run: npm run lint --workspace=backend

      - name: Lint admin
        run: npm run lint --workspace=admin

      - name: Run backend tests
        run: npm test --workspace=backend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check mobile
        run: npx tsc --noEmit
